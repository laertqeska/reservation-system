name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          for i in $(seq 1 60); do
            inv=$(curl -s -o /dev/null -w "%{http_code}" \
                    --connect-timeout 2 --max-time 5 \
                    http://localhost:8081/actuator/health || echo "000")
            res=$(curl -s -o /dev/null -w "%{http_code}" \
                    --connect-timeout 2 --max-time 5 \
                    http://localhost:8082/actuator/health || echo "000")
            echo "Attempt $i: inventory=$inv reservation=$res"
            if [ "$inv" = "200" ] && [ "$res" = "200" ]; then
              echo "Both services are healthy."
              exit 0
            fi
            sleep 3
          done
          echo "Timed out. Container state and logs follow."
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1

      - name: Smoke test — create item, then create reservation
        run: |
          set -e

          echo "== POST /items =="
          inv_status=$(curl -s -o /tmp/item.json -w "%{http_code}" \
            -X POST http://localhost:8081/items \
            -H 'Content-Type: application/json' \
            -d '{"sku":"CI-WIDGET","total":10,"available":8}')
          echo "HTTP $inv_status"
          cat /tmp/item.json
          echo
          if [ "$inv_status" != "201" ] && [ "$inv_status" != "200" ]; then
            echo "Item creation failed."
            exit 1
          fi

          echo "== POST /reservations =="
          res_status=$(curl -s -o /tmp/res.json -w "%{http_code}" \
            -X POST http://localhost:8082/reservations \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-smoke-1' \
            -d '{"itemId":1,"qty":2}')
          echo "HTTP $res_status"
          cat /tmp/res.json
          echo
          if [ "$res_status" != "201" ]; then
            echo "Reservation creation failed."
            exit 1
          fi

          echo "== Smoke test passed =="

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v