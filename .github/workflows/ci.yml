name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health > /dev/null \
               && curl -sf http://localhost:8082/actuator/health > /dev/null; then
              echo "Both services are up."
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting..."
            sleep 3
          done
          echo "Services did not become healthy within 3 minutes."
          exit 1

      - name: Smoke test — create item, then create reservation
        run: |
          set -e
          echo "== Creating inventory item =="
          curl -sf -X POST http://localhost:8081/items \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Widget","qty":10}'
          echo

          echo "== Creating reservation =="
          curl -sf -X POST http://localhost:8082/reservations \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-smoke-1' \
            -d '{"itemId":1,"qty":2}'
          echo

          echo "== Smoke test passed =="

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v